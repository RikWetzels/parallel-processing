[project]
name = "parallel-processing"
version = "0.1.0"
description = "Signal processing using CUDA with CuPy and Numba"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cuda-python>=13.1.1",
    "cupy-cuda13x>=13.0.0",
    "cutile>=0.0.0a0",
    "numba>=0.60.0",
    "numba-cuda>=0.23.0",
    "nvidia-cuda-nvrtc>=13.1.80",
    "nvidia-cuda-runtime>=13.1.80",
    "nvidia-nvjitlink>=13.1.80",
    "nvidia-nvvm>=13.1.80",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
